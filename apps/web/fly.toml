# Fly.io config for the Augury Market web frontend.
# Deploy from apps/web/: fly launch --no-deploy (first time) then fly deploy
app = "augury-market-web"
primary_region = "iad"

[build]
  [build.args]
    NEXT_PUBLIC_API_URL = "https://augury-market-api.fly.dev/api/v1"

[env]
  NODE_ENV = "production"
  # NEXT_PUBLIC_API_URL is baked in at build time (see Dockerfile) — set it
  # as a build arg / secret pointing at the deployed API's public URL, e.g.
  # https://augury-market-api.fly.dev/api/v1

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/login"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
